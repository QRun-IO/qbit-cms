# qbit-cms schema, version 1.0.0 baseline.
#
# The host includes this file from the qbit jar and runs it with its own
# Liquibase (the qbit never runs DDL). Properties the host may set before the
# include (the first definition wins):
#   cms.tablePrefix  table name prefix, must equal CmsQBitConfig.tableNamePrefix (default cms_)
#   cms.features     comma-separated CmsFeature names to install (default: all)
#   cms.seedReferenceData  insert the generic redirect, page and section types (default true)
# Changesets are only ever appended; released changesets never change.
databaseChangeLog:
  - property: { name: cms.tablePrefix, value: cms_ }
  - property: { name: cms.features, value: "CORE,MEDIA,BLOG,PROJECTS,PHOTOS,PUBLISHING,STREAM" }
  - property: { name: cms.seedReferenceData, value: "true" }

  # Halt when a table with a qbit-cms name exists but was not created by this
  # changelog (a name collision): choose another cms.tablePrefix.
  - changeSet:
      id: 1.0.0-guard-existing-tables
      author: qbit-cms
      logicalFilePath: qbit-cms/changelog
      runAlways: true
      preConditions:
        - onFail: HALT
        - onFailMessage: "A table named ${cms.tablePrefix}<name> exists but was not created by qbit-cms; set a different cms.tablePrefix"
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM (VALUES ('site'), ('domain'), ('redirect_type'), ('redirect'), ('page_type'), ('page'), ('page_section_type'), ('page_section'), ('snippet'), ('menu'), ('menu_item')) AS v(n)
              WHERE EXISTS (SELECT 1 FROM information_schema.tables t WHERE LOWER(t.table_name) = LOWER(CONCAT('${cms.tablePrefix}', v.n)))
              AND NOT EXISTS (SELECT 1 FROM DATABASECHANGELOG c WHERE c.FILENAME = 'qbit-cms/changelog' AND c.ID = CONCAT('1.0.0-create-', v.n))
      changes:
        - sql:
            sql: SELECT 1

  - changeSet:
      id: 1.0.0-create-site
      author: qbit-cms
      logicalFilePath: qbit-cms/changelog
      preConditions:
        - onFail: CONTINUE
        - sqlCheck:
            expectedResult: 1
            sql: SELECT CASE WHEN POSITION(',CORE,' IN CONCAT(',', REPLACE('${cms.features}', ' ', ''), ',')) > 0 THEN 1 ELSE 0 END
      changes:
        - createTable:
            tableName: ${cms.tablePrefix}site
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, primaryKeyName: "pk_${cms.tablePrefix}site", nullable: false }
              - column:
                  name: name
                  type: VARCHAR(40)
                  constraints: { nullable: false }
              - column:
                  name: short_name
                  type: VARCHAR(20)
                  constraints: { nullable: false }
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: create_date
                  type: TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: modify_date
                  type: TIMESTAMP
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: ${cms.tablePrefix}site
            columnNames: name
            constraintName: uq_${cms.tablePrefix}site_name

